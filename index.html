<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEPA-QR (EPC) Generator</title>
  <style>
    :root { --gap: 12px; --border: #d0d5dd; --bg: #f6f7f9; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 18px; line-height: 1.3; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 980px; }
    @media (min-width: 980px) { .grid { grid-template-columns: 1.1fr 0.9fr; } }
    .card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: white; }
    .row { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gap); }
    label { font-size: 12px; color: #475467; display: block; margin-bottom: 6px; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    .hint { font-size: 12px; color: #667085; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button { border: 1px solid var(--border); background: white; padding: 10px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
    button:hover { background: #f8fafc; }
    .qrWrap { display: grid; gap: 12px; justify-items: start; }
    #qrBox { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; background: #fff; }
    .sizeLine { display: flex; gap: 10px; align-items: center; }
    input[type="range"] { padding: 0; border: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* zart rot, wenn leer */
    .warn {
      background: #fff2f2;
      border-color: #f3b0b0;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="card">
      <h2 style="margin:0 0 12px 0;">Eingaben</h2>

      <div class="row">
        <div>
          <label for="name">Empfängername</label>
          <input id="name" autocomplete="off" placeholder="z.B. Musterfirma GmbH" />
        </div>

        <div class="row3">
          <div>
            <label for="iban">IBAN</label>
            <input id="iban" autocomplete="off" placeholder="AT..." />
          </div>
          <div>
            <label for="bic">BIC (optional)</label>
            <input id="bic" autocomplete="off" placeholder="z.B. BKAUATWW" />
          </div>
          <div>
            <label for="amount">Betrag (optional, EUR)</label>
            <input id="amount" autocomplete="off" placeholder="z.B. 12,34" />
          </div>
        </div>

        <div>
          <label for="purpose">Verwendungszweck (optional)</label>
          <textarea id="purpose" placeholder="z.B. Rechnung 2026-0001"></textarea>
          <div class="hint">Wird als unstructured remittance info codiert.</div>
        </div>

        <div>
          <label for="epcText">EPC/SEPA-Text (editierbar; wird als QR codiert)</label>
          <textarea id="epcText" class="mono"></textarea>
          <div class="hint">Wenn du dieses Feld editierst, wird es nicht mehr automatisch aus den Eingaben überschrieben.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 12px 0;">QR-Code</h2>

      <div class="qrWrap">
        <div class="sizeLine">
          <label style="margin:0;">Größe: <span id="sizeLabel" class="mono">320</span> px</label>
        </div>
        <input id="size" type="range" min="160" max="1024" step="8" value="320" />

        <div id="qrBox">
          <div id="qr"></div>
          <div id="qrHint" class="hint" style="margin-top:8px;">QR wird jederzeit gerendert (Quelle: EPC/SEPA-Textfeld).</div>
        </div>

        <div class="controls">
          <button id="btnPng" type="button">PNG herunterladen</button>
          <button id="btnSvg" type="button">SVG herunterladen</button>
        </div>

        <div class="hint">Download-Dateiname enthält Größe und Zeitstempel.</div>
      </div>
    </div>
  </div>

  <!-- kjua -->
  <script src="https://cdn.jsdelivr.net/npm/kjua@0.10.0/dist/kjua.min.js"></script>

  <script>
    // ===== TRACE SWITCH =====
    // Nur diese Variable umlegen:
    const TRACE = true;
    // =======================

    function tlog(...args) { if (TRACE) console.log(...args); }
    function tgroup(label) { if (TRACE) console.group(label); }
    function tgroupEnd()   { if (TRACE) console.groupEnd(); }

    function traceWrap(fnName, fn) {
      return function(...args) {
        tgroup(`[CALL] ${fnName}`);
        try {
          tlog("args:", args);
          const r = fn.apply(this, args);
          if (r && typeof r.then === "function") {
            return r.then(val => { tlog("return (async):", val); return val; })
                    .catch(err => { console.error(`[ERR] ${fnName}`, err); throw err; })
                    .finally(() => tgroupEnd());
          }
          tlog("return:", r);
          tgroupEnd();
          return r;
        } catch (err) {
          console.error(`[ERR] ${fnName}`, err);
          tgroupEnd();
          throw err;
        }
      };
    }

    const $ = traceWrap("$", (id) => document.getElementById(id));

    const elName    = $("name");
    const elIban    = $("iban");
    const elBic     = $("bic");
    const elAmount  = $("amount");
    const elPurpose = $("purpose");
    const elEpcText = $("epcText");

    const elSize     = $("size");
    const elSizeLbl  = $("sizeLabel");
    const elQr       = $("qr");
    const elQrHint   = $("qrHint");

    const btnPng = $("btnPng");
    const btnSvg = $("btnSvg");

    let lastSvgEl = null;
    let epcManual = false; // wird true, sobald epcText manuell editiert wurde

    const singleLine = traceWrap("singleLine", (s) => (s || "").replace(/\r?\n+/g, " ").trim());
    const normIban   = traceWrap("normIban",   (s) => (s || "").replace(/\s+/g, "").toUpperCase().trim());
    const normBic    = traceWrap("normBic",    (s) => (s || "").replace(/\s+/g, "").toUpperCase().trim());

    const normAmount = traceWrap("normAmount", (s) => {
      const raw = (s || "").trim().replace(/\s+/g, "").replace(",", ".");
      if (!raw) return "";
      const n = Number(raw);
      if (!Number.isFinite(n) || n <= 0) return ""; // leer lassen bei ungültig/<=0
      // EPC erwartet "EUR" + Betrag mit Punkt
      return "EUR" + n.toFixed(2);
    });

    // EPC QR (SCT) – V2: Version "002"
    const buildEpcText = traceWrap("buildEpcText", () => {
      const name = singleLine(elName.value);
      const iban = normIban(elIban.value);
      const bic  = normBic(elBic.value);
      const amt  = normAmount(elAmount.value);
      const purp = singleLine(elPurpose.value);

      const lines = [
        "BCD",
        "002", // V2
        "1",   // UTF-8
        "SCT",
        bic,   // optional in V2 (je nach Kontext), hier optional
        name,
        iban,
        amt,   // optional (EURxx.xx)
        "",    // purpose code
        "",    // remittance reference
        purp,  // remittance text
        ""     // info
      ];
      const epc = lines.join("\n");
      tlog("EPC text preview:\n" + epc);
      return epc;
    });

    const clearNode = traceWrap("clearNode", (node) => {
      while (node.firstChild) node.removeChild(node.firstChild);
    });

    const applyWarnings = traceWrap("applyWarnings", () => {
      const nameEmpty = singleLine(elName.value).length === 0;
      const ibanEmpty = normIban(elIban.value).length === 0;

      elName.classList.toggle("warn", nameEmpty);
      elIban.classList.toggle("warn", ibanEmpty);

      tlog("warnings:", { nameEmpty, ibanEmpty });
    });

    const renderQrFromEpcText = traceWrap("renderQrFromEpcText", () => {
      const size = parseInt(elSize.value, 10);
      elSizeLbl.textContent = String(size);
      tlog("size:", size);

      const text = (elEpcText.value || "");
      const encodeText = text.length ? text : " "; // kjua mag i.d.R. keinen komplett leeren Text
      tlog("encodeText length:", encodeText.length);

      clearNode(elQr);
      lastSvgEl = null;

      tlog("kjua(svg) render start");
      const svg = kjua({
        render: "svg",
        text: encodeText,
        size: size,
        crisp: true,
        quiet: 2
      });
      tlog("kjua(svg) render done:", svg);

      elQr.appendChild(svg);
      lastSvgEl = svg;
    });

    const render = traceWrap("render", () => {
      applyWarnings();

      // EPC-Text nur automatisch setzen, solange nicht manuell editiert
      if (!epcManual) {
        elEpcText.value = buildEpcText();
        tlog("epcText updated from inputs (auto).");
      } else {
        tlog("epcManual=true -> epcText NOT overwritten.");
      }

      renderQrFromEpcText();
      elQrHint.style.display = "block";
    });

    const downloadBlob = traceWrap("downloadBlob", (blob, filename) => {
      tlog("filename:", filename, "blob:", blob);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    const ts = traceWrap("ts", () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
    });

    btnSvg.addEventListener("click", traceWrap("onClick(btnSvg)", () => {
      if (!lastSvgEl) { tlog("No SVG to download."); return; }

      const serializer = new XMLSerializer();
      let svgText = serializer.serializeToString(lastSvgEl);

      if (!svgText.includes('xmlns="http://www.w3.org/2000/svg"')) {
        svgText = svgText.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
      }

      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const size = parseInt(elSize.value, 10);
      downloadBlob(blob, `sepa-qr_${size}px_${ts()}.svg`);
    }));

    btnPng.addEventListener("click", traceWrap("onClick(btnPng)", () => {
      const size = parseInt(elSize.value, 10);
      const text = (elEpcText.value || "");
      const encodeText = text.length ? text : " ";

      tlog("kjua(canvas) render start");
      const canvas = kjua({
        render: "canvas",
        text: encodeText,
        size: size,
        crisp: true,
        quiet: 2
      });
      tlog("kjua(canvas) render done:", canvas);

      canvas.toBlob(traceWrap("canvas.toBlob(callback)", (blob) => {
        tlog("toBlob result:", blob);
        if (!blob) return;
        downloadBlob(blob, `sepa-qr_${size}px_${ts()}.png`);
      }), "image/png");
    }));

    function bindInput(el, evt, handler) {
      el.addEventListener(evt, traceWrap(`event(${el.id}).${evt}`, handler));
    }

    // Eingabefelder: triggern render(), überschreiben epcText nur solange epcManual=false
    ["input", "change"].forEach(evt => {
      bindInput(elName, evt, render);
      bindInput(elIban, evt, render);
      bindInput(elBic, evt, render);
      bindInput(elAmount, evt, render);
      bindInput(elPurpose, evt, render);
      bindInput(elSize, evt, render);
    });

    // EPC-Feld: manuell -> epcManual setzen, QR sofort daraus rendern
    ["input", "change"].forEach(evt => {
      bindInput(elEpcText, evt, traceWrap("onEpcEdit", () => {
        epcManual = true;
        tlog("epcManual set to true (user edited EPC text).");
        applyWarnings();
        renderQrFromEpcText();
      }));
    });

    render();
  </script>
</body>
</html>
